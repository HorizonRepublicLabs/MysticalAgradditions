plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '26.3-9.0.3'
group = 'com.blakebr0.mysticalagradditions'

base {
    archivesName = 'MysticalAgradditions'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    maven {
        name = 'GitHubPackages'
        url 'https://maven.pkg.github.com/HorizonRepublicLabs/maven'

        credentials {
            username = System.getenv('GITHUB_ACTOR')
            password = System.getenv('GITHUB_TOKEN')
        }
    }
    maven { url 'https://maven.blakesmods.com' }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenLocal()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }

        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'terminal.jline', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
            ideName = "MysticalAgradditions - ${it.ideName.get()}"
        }
    }

    mods {
        mysticalagradditions {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.blakebr0.cucumber:cucumber:${cucumber_version}"
    implementation "com.blakebr0.mysticalagriculture:mysticalagriculture:${mysticalagriculture_version}"
    // Compile-only until a Jade 26.3 file id is pinned: the 26.2 jar is rejected at runtime on 26.3.
    compileOnly "curse.maven:jade-324717:${jade_version}"
//  implementation 'slimeknights.tconstruct:TConstruct:1.18.2-3.5.1.31'
//  implementation 'slimeknights.mantle:Mantle:1.18.2-1.9.27'

    // TODO: re-enable once Patchouli publishes a 26.3 build (newest is 26.1-94, which FML rejects on 26.3)
//  runtimeOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}

java.withSourcesJar()

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_version                 : version.split('-').last(),
            cucumber_version            : cucumber_version.split('-').last(),
            mysticalagriculture_version : mysticalagriculture_version.split('-').last(),
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            // GitHub Packages rejects uppercase artifactIds
            artifactId = 'mysticalagradditions'
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/HorizonRepublicLabs/maven'

            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}